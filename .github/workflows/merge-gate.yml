# The Merge gate is a commit status ("Merge gate") that the Claude review and Claude fix jobs post as their
# last step (scripts/merge-gate.sh, read from the default branch). This small workflow covers the two cases
# those jobs don't:
# - the owner removes `needs-human` (after approving the spec again), and
# - a manual re-run: gh workflow run merge-gate.yml -f pr=<number>
# Every other label change is skipped at the job level, which GitHub does not bill.
name: Merge gate

on:
  pull_request:
    types: [unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-human'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update the merge gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/$REPO/contents/scripts/merge-gate.sh?ref=$DEFAULT_BRANCH" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/merge-gate.sh"
          bash "$RUNNER_TEMP/merge-gate.sh"
