# A required check that stays red while a PR must not merge. It passes only when:
# - the PR has no needs-human label (a design question is waiting on the spec's Design review), and
# - no review thread (from Claude, Codex or a person) is unresolved, and
# - the latest Claude review summary, written after the latest commit, ends "Verdict: ready to merge".
# Make it a required check (docs/github.md) so GitHub auto-merge waits for it.
# Resolving a thread fires no event, and labels added with GITHUB_TOKEN trigger no workflows, so the
# review and fix workflows re-run this check with workflow_dispatch on the PR branch.
name: Merge gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check labels, review threads and the review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          owner="${REPO%/*}"; name="${REPO#*/}"
          labels=$(gh pr view "$PR" -R "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          if echo ",$labels," | grep -q ",needs-human,"; then
            echo "::error::This PR has a design question waiting (needs-human). It clears when the spec is approved again in its Design review."
            exit 1
          fi
          # Count every unresolved thread, outdated or not: a fix push makes old threads outdated,
          # including security threads still waiting for a second check.
          unresolved=$(gh api graphql --paginate -F owner="$owner" -F name="$name" -F pr="$PR" -f query='
            query($owner:String!,$name:String!,$pr:Int!,$endCursor:String){
              repository(owner:$owner,name:$name){
                pullRequest(number:$pr){
                  reviewThreads(first:100, after:$endCursor){
                    nodes{ isResolved }
                    pageInfo{ hasNextPage endCursor }
                  }
                }
              }
            }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length' \
            | awk '{s+=$1} END {print s+0}')
          if [ "$unresolved" -gt 0 ]; then
            echo "::error::$unresolved review thread(s) are unresolved. The fix workflow answers and resolves them."
            exit 1
          fi
          # The latest Claude review summary must be newer than the latest commit and say ready to merge.
          head_date=$(gh pr view "$PR" -R "$REPO" --json commits --jq '.commits[-1].committedDate')
          verdict=$(gh pr view "$PR" -R "$REPO" --json comments --jq '
            [.comments[] | select((.author.login | test("^claude"; "i")) and (.body | test("Verdict: (ready to merge|changes needed)")))]
            | sort_by(.updatedAt // .createdAt) | last
            | if . == null then "none" else "\(.updatedAt // .createdAt) \(if (.body | test("Verdict: ready to merge")) then "ready" else "changes" end)" end')
          if [ "$verdict" = "none" ]; then
            echo "::error::No Claude review verdict yet."
            exit 1
          fi
          verdict_date="${verdict% *}"; verdict_word="${verdict##* }"
          if [[ "$verdict_date" < "$head_date" ]]; then
            echo "::error::The latest Claude review is older than the latest commit ($verdict_date < $head_date). Waiting for a new review."
            exit 1
          fi
          if [ "$verdict_word" != "ready" ]; then
            echo "::error::The latest Claude review says changes are needed."
            exit 1
          fi
          echo "Merge gate passed: no design question, no unresolved threads, and the latest review says ready to merge."
