# Claude builds Linear issues and answers @claude mentions.
# - An issue labelled `claude` (synced from Linear) is implemented end to end: branch, code, tests, draft PR.
# - A comment containing @claude on an issue or PR gets Claude to act on it.
# Runs on GitHub's servers with your Claude subscription (secret CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`).
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    # A Linear issue synced to GitHub with the `claude` label: build it and open a draft PR.
    if: github.event_name == 'issues' && github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional: uncomment to keep Claude attribution out of commits and PRs (see docs/options.md).
          # settings: '{"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}'
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            ISSUE TITLE: ${{ github.event.issue.title }}

            Build this issue end to end, following CLAUDE.md.
            1. Read the issue body and its comments. The Linear ID (for example ABC-12) is in the linear-linkback comment.
            2. Create a branch named claude/<linear-id-lowercase>-<short-slug>, make the change, and run ./scripts/check.sh (CLAUDE.md lists any other checks).
            3. Commit with a plain imperative message, and push the branch.
            4. Open a draft PR with `gh pr create --draft --base main`. The body starts with "Fixes <Linear ID>", then says what changed and how it was checked.
            5. If the checks pass, mark it ready with `gh pr ready`.
            If the acceptance criteria are unclear, comment on the issue with your question and stop.
          claude_args: --max-turns 60 --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr ready:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(./scripts/check.sh)"

  mention:
    # Anyone (not a bot) writing @claude on an issue or PR.
    if: |
      github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional: uncomment to keep Claude attribution out of commits and PRs (see docs/options.md).
          # settings: '{"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}'
          track_progress: true
          claude_args: --max-turns 60
