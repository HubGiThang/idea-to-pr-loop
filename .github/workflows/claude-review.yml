# Claude reviews every ready PR and every new push to it. ChatGPT Codex reviews the same PRs
# through its own GitHub integration (turned on in Codex settings), so each PR gets two independent reviews.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs are opened by claude[bot], so the action must accept bot actors.
          allowed_bots: '*'
          # Optional: uncomment to keep Claude attribution out of commits and PRs (see docs/options.md).
          # settings: '{"includeCoAuthoredBy": false, "attribution": {"commit": "", "pr": ""}}'
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the linked Linear issue's acceptance criteria (the PR body links it).
            Focus on correctness bugs, missing tests for the acceptance criteria, security problems, and anything
            that breaks the conventions in CLAUDE.md. Skip style nits a formatter would catch.
            Start any security finding with [security] so it is never auto-resolved.
            Post findings as inline comments on the exact lines, then one summary comment that ends with either
            "Verdict: ready to merge" or "Verdict: changes needed".
          claude_args: --max-turns 30 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
