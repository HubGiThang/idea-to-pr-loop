# Tells the site repo that the template changed, so its page can rebuild (see docs/site-markers.md).
# Needs the secret SITE_DISPATCH_TOKEN and the repo variable SITE_REPO (OWNER/REPO). Without both it
# skips with a notice, so copies of the template are not broken.
name: Site dispatch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_REPO: ${{ vars.SITE_REPO }}
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - name: Send template-updated
        run: |
          if [ -z "$SITE_REPO" ] || [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::Skipped: set the variable SITE_REPO and the secret SITE_DISPATCH_TOKEN to notify the site repo."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$SITE_REPO/dispatches" \
            -d "{\"event_type\":\"template-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"
          echo "Sent template-updated ($SHA) to $SITE_REPO."
